<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복사 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#fafafa;--ink:#111114;--sub:#868b95;--line:#e8e8eb;--hover:#f0f0f3;--code:#f4f4f7;--field:#fff;--acc:#111114;--acc-ink:#fff;--ok:#16a34a;--err:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--ink:#f3f3f5;--sub:#7f848e;--line:#222226;--hover:#18181c;--code:#141417;--field:#131316;--acc:#f3f3f5;--acc-ink:#0d0d0f;--ok:#4ade80;--err:#ff6b70}}
*{box-sizing:border-box;box-shadow:none!important;text-shadow:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:720px;margin:0 auto;padding:64px 20px 96px}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}

.top{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.logo{color:var(--ink);display:grid;place-items:center}
.logo svg{width:32px;height:32px;stroke-width:1.7}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.2}
.sub{color:var(--sub);margin:2px 0 0;font-size:14px}

.search{position:relative;margin-bottom:18px}
.search>svg{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--sub);pointer-events:none;transition:color .2s}
.search:focus-within>svg{color:var(--ink)}
#q{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);font:inherit;padding:0 46px;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
#q::-webkit-search-cancel-button{display:none}
#q::placeholder{color:var(--sub)}
#q:focus{border-color:var(--ink)}
.clear{position:absolute;right:10px;top:50%;width:30px;height:30px;margin-top:-15px;border:0;border-radius:50%;background:var(--hover);color:var(--sub);cursor:pointer;display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.7,.2,1),color .2s}
.clear svg{width:14px;height:14px}
.clear:hover{color:var(--ink)}
.search.has .clear{opacity:1;transform:none;pointer-events:auto}

.tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--sub);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.tab svg{width:17px;height:17px}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab:active{transform:scale(.96)}
.tab[aria-selected=true]{background:var(--acc);color:var(--acc-ink)}
.tab small{font-size:12px;font-weight:600;opacity:.6}

button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.item{border-bottom:1px solid var(--line);animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.head{display:flex;align-items:center;gap:12px;padding:14px 2px}
.ico{width:38px;height:38px;border-radius:11px;background:var(--hover);color:var(--sub);display:grid;place-items:center;transition:background .25s,color .25s}
.ico svg{width:18px;height:18px}
.item:hover .ico,.item.open .ico{background:var(--acc);color:var(--acc-ink)}
.name{flex:1;min-width:0;font-weight:600;letter-spacing:-.01em;word-break:break-all}
.btn{display:flex;align-items:center;gap:6px;height:36px;border:0;background:none;color:var(--sub);padding:0 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500;transition:background .2s,color .2s,transform .15s}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn:active{transform:scale(.95)}
.view .chev{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.item.open .view .chev{transform:rotate(180deg)}
.copy{background:var(--acc);color:var(--acc-ink);font-weight:600;min-width:84px;justify-content:center}
.copy:hover{background:var(--acc);color:var(--acc-ink);opacity:.85}
.copy .i-ok{display:none}
.copy.done{background:var(--ok);color:#fff;opacity:1;animation:pop .35s cubic-bezier(.2,.7,.2,1)}
.copy.done:hover{background:var(--ok);color:#fff;opacity:1}
.copy.done .i-copy{display:none}
.copy.done .i-ok{display:block;stroke-dasharray:24;animation:draw .4s .05s ease-out both}
.copy.fail{background:var(--err);color:#fff}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.7,.2,1)}
.item.open .fold{grid-template-rows:1fr}
.fold>div{overflow:hidden}
pre{margin:0 0 16px;padding:16px;background:var(--code);border-radius:12px;max-height:320px;overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-all}

.skel{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 2px}
.skel i{display:block;border-radius:10px;background:var(--hover);animation:pulse 1.2s ease-in-out infinite}
.skel i:first-child{width:38px;height:38px;border-radius:11px}
.skel i:last-child{height:14px;width:40%}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--sub);padding:56px 0;text-align:center;animation:rise .4s both}
.empty svg{width:44px;height:44px;stroke-width:1.4}
.empty.err{color:var(--err)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top in">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></div>
    <div><h1>복사 허브</h1><p class="sub">파일을 고르고 복사를 누르면 바로 복사돼요.</p></div>
  </div>
  <div class="search in" id="search" style="animation-delay:.08s">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="파일 이름 검색" autocomplete="off" aria-label="파일 이름 검색">
    <button class="clear" id="clear" aria-label="검색어 지우기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="tabs in" id="tabs" role="tablist" style="animation-delay:.16s"></div>
  <div id="list"></div>
</div>
<script>
// ▼ 필요하면 직접 지정 (비워두면 GitHub Pages 주소에서 자동 인식)
const OWNER = "";
const REPO  = "";
const BRANCH = "main";
const FOLDERS = ["Scripts","Configs","Others"];
// 텍스트가 아닌 파일(이미지·압축 등)은 목록에서 제외
const BIN = /\.(png|jpe?g|gif|webp|ico|bmp|zip|rar|7z|gz|tar|exe|dll|pdf|mp[34]|mov|avi|woff2?|ttf|otf)$/i;

const I = {
  copy:'<svg class="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg><svg class="i-ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  file:'<svg viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  Scripts:'<svg viewBox="0 0 24 24"><path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></svg>',
  Configs:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  Others:'<svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2.5h6.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',
  none:'<svg viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5M9.5 13.5l5 5M14.5 13.5l-5 5"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>'
};

const host = location.hostname, parts = location.pathname.split("/").filter(Boolean);
const owner = OWNER || (host.endsWith(".github.io") ? host.split(".")[0] : "");
const repo  = REPO  || (host.endsWith(".github.io") ? (parts[0] && !parts[0].includes(".") ? parts[0] : owner + ".github.io") : "");

const data = {}, texts = {};
let current = FOLDERS[0];
const $q = document.getElementById("q"), $search = document.getElementById("search");

const why={};
let manifest;
async function getManifest(){
  if(manifest!==undefined) return manifest;
  try{ const r=await fetch("manifest.json",{cache:"no-cache"}); manifest=r.ok?await r.json():null; }
  catch(e){ manifest=null; }
  return manifest;
}
async function listFolder(f){
  // 1순위: manifest.json (Vercel 빌드가 자동 생성), 2순위: GitHub API
  const m=await getManifest();
  if(m && Array.isArray(m[f])) return m[f].filter(n=>!BIN.test(n));
  if(!owner||!repo){why[f]="NOREPO";return null;}
  try{
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${f}?ref=${BRANCH}`);
    if(!r.ok){why[f]=r.status;return null;}
    return (await r.json()).filter(x=>x.type==="file" && !BIN.test(x.name)).map(x=>x.name);
  }catch(e){ why[f]="NET"; return null; }
}
function errText(f){
  const w=why[f], who=owner&&repo?`${owner}/${repo}`:"(알 수 없음)";
  const m={NOREPO:"manifest.json이 없고 주소에서 저장소도 알 수 없어요. Vercel 빌드 명령을 node build.js 로 설정하거나, 주소를 아이디.github.io/저장소명 으로 여세요.",
   404:"GitHub가 이 폴더를 못 찾았어요. 저장소가 비공개이거나, 저장소·폴더·브랜치 이름이 달라요.",
   403:"GitHub API 요청 한도를 넘었어요. 잠시 뒤 다시 하거나 manifest.json을 추가하세요.",
   NET:"GitHub에 연결하지 못했어요. 인터넷 연결을 확인하세요."};
  return `${m[w]||"알 수 없는 오류예요."}<br><small>확인한 곳: ${who} / ${f} / ${BRANCH} · 응답: ${w||"-"}</small>`;
}
async function getText(f,n){
  const k=f+"/"+n;
  if(texts[k]!==undefined) return texts[k];
  const r = await fetch(`${encodeURIComponent(f)}/${encodeURIComponent(n)}`,{cache:"no-cache"});
  if(!r.ok) throw new Error(r.status);
  return texts[k]=await r.text();
}
async function copy(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
}
function renderTabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  FOLDERS.forEach(f=>{
    const b=document.createElement("button");
    b.className="tab"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",f===current);
    const c=data[f]; b.innerHTML=`${I[f]||I.Others}<span>${f}</span><small>${c?c.length:""}</small>`;
    b.onclick=()=>{current=f;renderTabs();renderList();};
    el.appendChild(b);
  });
}
function renderList(){
  const el=document.getElementById("list"), q=$q.value.trim().toLowerCase();
  el.innerHTML="";
  const files=data[current];
  if(files===undefined){el.innerHTML='<div class="skel"><i></i><i></i></div>'.repeat(3);return;}
  if(files===null){el.innerHTML=`<div class="empty err">${I.warn}<div>${errText(current)}</div></div>`;return;}
  const shown=files.filter(n=>n.toLowerCase().includes(q));
  if(!shown.length){el.innerHTML=`<div class="empty">${I.none}<div>${q?"검색 결과가 없어요.":"이 폴더에 파일이 없어요."}</div></div>`;return;}
  shown.forEach((n,i)=>{
    const d=document.createElement("div"); d.className="item"; d.style.animationDelay=Math.min(i,10)*45+"ms";
    d.innerHTML=`<div class="head"><div class="ico">${I.file}</div><span class="name"></span><button class="btn view"><span>미리보기</span>${I.chev}</button><button class="btn copy">${I.copy}<span>복사</span></button></div><div class="fold"><div><pre></pre></div></div>`;
    d.querySelector(".name").textContent=n;
    const pre=d.querySelector("pre"), view=d.querySelector(".view"), cp=d.querySelector(".copy"), label=cp.querySelector("span"), vl=view.querySelector("span");
    view.onclick=async()=>{
      if(d.classList.contains("open")){d.classList.remove("open");vl.textContent="미리보기";return;}
      try{pre.textContent=await getText(current,n);}catch(e){pre.textContent="파일을 읽지 못했어요.";}
      d.classList.add("open");vl.textContent="닫기";
    };
    let t;
    cp.onclick=async()=>{
      clearTimeout(t); cp.classList.remove("done","fail");
      try{
        await copy(await getText(current,n));
        void cp.offsetWidth; label.textContent="복사됨"; cp.classList.add("done");
      }catch(e){label.textContent="실패"; cp.classList.add("fail");}
      t=setTimeout(()=>{label.textContent="복사";cp.classList.remove("done","fail");},1500);
    };
    el.appendChild(d);
  });
}
$q.oninput=()=>{$search.classList.toggle("has",!!$q.value);renderList();};
document.getElementById("clear").onclick=()=>{$q.value="";$search.classList.remove("has");renderList();$q.focus();};
renderTabs(); renderList();
Promise.all(FOLDERS.map(async f=>{data[f]=await listFolder(f);renderTabs();if(f===current)renderList();}));
</script>
</body>
</html>
